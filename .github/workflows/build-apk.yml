name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias rotas -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rotas123 -keypass rotas123 \
            -dname "CN=Rotas Inteligentes, OU=App, O=Rotas, L=Porto Alegre, ST=RS, C=BR"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rotas-Inteligentes-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rotas-Inteligentes-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
