<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da3ff"/>
      <stop offset="100%" style="stop-color:#0056b3"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#003366" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Sombra -->
  <ellipse cx="256" cy="460" rx="100" ry="20" fill="#003366" opacity="0.15"/>
  <!-- Corpo do marcador -->
  <path d="M256 30C149 30 64 115 64 222c0 130 192 290 192 290s192-160 192-290C448 115 363 30 256 30z"
        fill="url(#pinGrad)" filter="url(#shadow)"/>
  <!-- Brilho superior -->
  <path d="M120 200C120 120 180 60 256 60c40 0 76 18 102 48"
        fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Círculo interno branco -->
  <circle cx="256" cy="210" r="90" fill="white"/>
  <!-- Seta de navegação (compasso) -->
  <polygon points="256,145 282,265 256,240 230,265" fill="#0056b3"/>
  <polygon points="256,275 230,265 256,240 282,265" fill="#4da3ff"/>
  <!-- Ponto central -->
  <circle cx="256" cy="210" r="12" fill="#007bff"/>
  <circle cx="256" cy="210" r="5" fill="white"/>
</svg>
